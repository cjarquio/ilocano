services:
  db:
    image: postgres:17
    container_name: ilocano_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - ilocano-app
  backend:
    container_name: ilocanobackend
    build:
      context: ./ilocanobackend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    depends_on:
      - db
    environment:
      - DJANGO_KEY=${DJANGO_KEY}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
    env_file:
      - .env
    networks:
      - ilocano-app
    volumes:
      - ./ilocanobackend:/app/backend
    command: bash -c "sleep 10 && python manage.py makemigrations && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
  frontend:
    container_name: letsspeakilocano
    build:
      context: ./letsspeakilocano
      dockerfile: Dockerfile
    restart: on-failure
    ports:
      - '3000:3000'
    depends_on:
      - backend
    volumes:
      - ./letsspeakilocano:/app/frontend
    networks:
      - ilocano-app
  nginx:
    container_name: ilocano_nginx
    restart: always
    depends_on:
      - backend
      - frontend
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    networks:
      - ilocano-app
volumes:
  postgres_data:
networks:
  ilocano-app:
    driver: bridge
